@media(max-width:380px){.calendar-year-view{gap:7px}.year-month{padding:8px 3px}.year-month-title{font-size:12px}.year-month-grid{gap:2px 0}.year-month-grid span{height:19px;font-size:9px;line-height:19px;background:radial-gradient(circle 8px at center,#F2F0E8 98%,transparent 100%)}.year-month-grid .year-vacation{background:radial-gradient(circle 8px at center,#D7E4D9 98%,transparent 100%)}.year-month-grid .year-weekend{background:radial-gradient(circle 8px at center,#E8D6CF 98%,transparent 100%)}.year-month-grid .year-weekday{height:15px;line-height:15px;font-size:8px}}

.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

<div class="app">

function load(){
 try{
  const saved=localStorage.getItem(KEY);
  if(!saved)return clone(initial);
  const x=JSON.parse(saved);
  return {
   ...clone(initial),...x,
   profile:{...initial.profile,...(x.profile||{})},
   schedule:Array.isArray(x.schedule)?x.schedule:[],
   classSchedules:Object.fromEntries(Object.entries({...clone(initial.classSchedules),...(x.classSchedules||{})}).map(([className,lessons])=>{if(["8А","8В","8Г","8Д","8Е","9А"].includes(className)){const savedRooms=new Map((x.classSchedules?.[className]||[]).map(lesson=>[lesson.id,lesson.room]));return [className,(initial.classSchedules[className]||[]).map(lesson=>({...lesson,...(savedRooms.has(lesson.id)?{room:savedRooms.get(lesson.id)}:{})}))];}return [className,lessons];})),
   tasks:Array.isArray(x.tasks)?x.tasks:[],
   deadlines:Array.isArray(x.deadlines)?x.deadlines:[],
   grades:Array.isArray(x.grades)?x.grades:[],
   goals:Array.isArray(x.goals)?x.goals:[]
  };
 }catch(e){return clone(initial)}
}

 return d.getDay()===0||d.getDay()===6||schoolHolidayDates.includes(key)?"weekend":"";
}
function isNoSchoolDate(key){return key<"2026-09-01"||key>"2027-05-31"||calendarDayType(key)!=="";}
function getActiveSchedule(){
 const classList=Array.isArray(data.classSchedules?.[data.profile.schoolClass])?data.classSchedules[data.profile.schoolClass]:[];
 const subgroupClasses=["6М","8А","8В","8Г","8Д","8Е","9А"];const schoolLessons=subgroupClasses.includes(data.profile.schoolClass)?classList.filter(t=>!t.subGroup||t.subGroup===(data.profile.subGroup||"1")):classList;
 const personalLessons=Array.isArray(data.schedule)?data.schedule:[];
 return [...schoolLessons,...personalLessons];
}

  return `<button class="year-month" data-action="calendar-open-month" data-month="${m}" data-year="${monthYear}" aria-label="Открыть ${new Date(monthYear,m,1).toLocaleDateString("ru-RU",{month:"long"})}">

    const key=localDate(new Date(monthYear,m,n)),type=calendarDayType(key);
    return `<span class="${type==="vacation"?"year-vacation":type==="weekend"?"year-weekend":""} ${key===today?"year-today":""}">${n}</span>`;
   }).join("")}</div></button>`;
 }).join("");

function renderCalendar(){
 const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
 const monthName=calendarMonth.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
 const first=new Date(year,month,1);
 const offset=(first.getDay()+6)%7;
 const start=new Date(year,month,1-offset);
 const cells=[];
 for(let i=0;i<42;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const key=localDate(d);
  const tasks=data.tasks.filter(x=>x.date===key);
  const deadlines=data.deadlines.filter(x=>x.date===key);
  const lessons=getActiveSchedule().filter(x=>x.day===(d.getDay()+6)%7);
  const count=tasks.length+deadlines.length+lessons.length;
  cells.push({key,number:d.getDate(),sameMonth:d.getMonth()===month,isToday:key===today,selected:key===selectedCalendarDate,count,
   dots:[...Array(Math.min(tasks.length,2)).fill("task"),...Array(Math.min(deadlines.length,2)).fill("deadline"),...Array(Math.min(lessons.length,1)).fill("lesson")].slice(0,3)});
 }
 const chosenTasks=data.tasks.filter(x=>x.date===selectedCalendarDate);
 const chosenDeadlines=data.deadlines.filter(x=>x.date===selectedCalendarDate);
 const chosenLessons=getActiveSchedule().filter(x=>x.day===(dateObj(selectedCalendarDate).getDay()+6)%7).sort((a,b)=>a.time.localeCompare(b.time));
 content.innerHTML=`<h1>Календарь ${uiIcon("calendar")}</h1><p class="muted">Текущая дата: ${dateObj(today).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}</p>
 <div class="card">

   <button class="small-btn" data-action="calendar-prev" aria-label="Предыдущий месяц">‹</button>

  ${cells.map(x=>`<button class="calendar-day ${x.sameMonth?"":"muted-day"} ${x.isToday?"today":""} ${x.selected?"selected":""}" data-action="calendar-select" data-date="${x.key}">
   <span class="day-number">${x.number}</span><span class="calendar-dots">${x.dots.map(d=>`<i title="${d}"></i>`).join("")}</span></button>`).join("")}</div>
  <button class="secondary full" data-action="calendar-today">Перейти к сегодня</button>
 </div>
 <div class="section-head"><h2>${dateObj(selectedCalendarDate).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</h2><button class="small-btn" data-action="calendar-add-task">＋ Задание</button></div>

function renderGrades(){
 const subjects=[...new Set([
  ...data.grades.map(g=>g.subject),

 ])].sort((a,b)=>a.localeCompare(b,"ru"));
 const overall=avg(data.grades);
 content.innerHTML=`<h1>Мои оценки ${uiIcon("star")}</h1>

    <h3>${esc(subject)}</h3>

   <div style="display:flex;gap:20px;align-items:center;margin-top:12px">

    ${target!==null?`<div><div class="muted">Желаю</div><div class="grade-big">${target}</div></div>`:""}
   </div>
   <div class="progress"><div style="width:${progress}%"></div></div>
   ${target!==null?`<div class="goal-box"><strong>Моя цель: ${target}</strong><p class="muted">${average===null?"Добавь первую оценку, чтобы отслеживать результат.":average>=target?"Цель достигнута по текущему среднему баллу!":"Продолжай заниматься — отслеживай свой прогресс."}</p></div>`:""}
   <div class="section-head" style="margin:15px 0 10px"><strong>История оценок</strong>
    <button class="small-btn" data-action="add-grade-subject" data-subject="${esc(subject)}">＋ Добавить</button>
   </div>
   ${list.length?list.map(g=>`<div class="item" style="align-items:center">
    <div class="grade-big">${g.value}</div><div class="item-main"><h3>${formatDate(g.date)}</h3><p>${esc(g.subject)}</p></div>
    <div class="item-actions">
     <button class="small-btn" data-action="edit-grade" data-id="${g.id}">${uiIcon("pencil")}</button>
     <button class="small-btn danger" data-action="delete-grade" data-id="${g.id}">×</button>
    </div></div>`).join(""):empty("📘","Пока нет оценок по этому предмету")}
  </section>`;
 }).join(""):`
 <div class="card">${empty("⭐","Добавь первую оценку или создай цель по предмету.")}</div>`}`;

/* Формы */
function openModal(title,html,submit){
 modalRoot.innerHTML=`<div class="modal-bg"><div class="modal">
 <div class="modal-head"><h2 style="margin:0">${esc(title)}</h2><button class="close" type="button" data-action="close-modal">×</button></div>
 <form id="edit-form">${html}<button class="primary full" type="submit">Сохранить</button></form>
 </div></div>`;
 const backdrop=$(".modal-bg");
 backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeModal()});
 $("#edit-form").addEventListener("submit",e=>{
  e.preventDefault();
  const values=Object.fromEntries(new FormData(e.currentTarget).entries());
  if(submit(values)!==false){save();closeModal();render()}
 });
 $(".modal").addEventListener("click",e=>{
  const close=e.target.closest('[data-action="close-modal"]');
  if(close){e.preventDefault();closeModal();return}
  e.stopPropagation();
 });
}
function closeModal(){modalRoot.innerHTML=""}
function field(label,name,value="",type="text",required=true){
 return `<div class="field"><label>${esc(label)}</label><input type="${type}" name="${name}" value="${esc(value)}" ${required?"required":""}></div>`;
}
function selectField(label,name,options,selected){
 return `<div class="field"><label>${esc(label)}</label><select name="${name}" required>
 ${options.map(o=>`<option value="${esc(o)}" ${String(o)===String(selected)?"selected":""}>${esc(o)}</option>`).join("")}
 </select></div>`;
}

 <div id="class-options" style="max-height:240px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--border,#ddd);border-radius:14px;padding:6px;background:var(--card,#fff)" role="listbox" aria-label="Список классов">
 <button type="button" class="class-option" data-class="none" style="display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:10px;background:${!current?"var(--soft,#eef1f8)":"transparent"};color:inherit;font:inherit">Класс не выбран</button>
 ${options.map(x=>`<button type="button" class="class-option" data-class="${esc(x)}" style="display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:10px;background:${x===current?"var(--soft,#eef1f8)":"transparent"};color:inherit;font:inherit">${esc(x)}</button>`).join("")}
 </div>
 <div id="subgroup-field" class="field" style="display:${["6М","8А","8В","8Г","8Д","8Е","9А"].includes(current)?"block":"none"}">
 <label for="subGroup" id="subgroup-label">${current==="6М"?"Моя подгруппа (для уроков труда)":"Моя подгруппа (для английского языка)"}</label>
 <select id="subGroup" name="subGroup">
 ${["1-я подгруппа","2-я подгруппа"].map((label,i)=>`<option value="${i+1}" ${(data.profile.subGroup||"1")===String(i+1)?"selected":""}>${label}</option>`).join("")}
 </select></div>
 <p class="muted">Можно выбрать класс или оставить вариант «Класс не выбран».</p>`,v=>{
  const raw=v.schoolClass.trim();
  const chosen=raw==="none"?"none":raw.toLocaleUpperCase("ru");
  if(chosen!=="none"&&!options.includes(chosen))return false;
  data.profile.schoolClass=chosen;
  if(["6М","8А","8В","8Г","8Д","8Е","9А"].includes(chosen))data.profile.subGroup=v.subGroup||"1";
  data.schedule=[];
 });
 const search=$("#class-search"),hidden=$("#school-class-value"),list=$("#class-options");
 const groupField=$("#subgroup-field");
 const filter=()=>{
  const q=search.value.trim().toLocaleLowerCase("ru");
  list.querySelectorAll("[data-class]").forEach(el=>{
   const label=el.dataset.class==="none"?"класс не выбран":el.dataset.class;
   const match=!q||label.toLocaleLowerCase("ru").includes(q);
   el.hidden=!match;el.style.display=match?"block":"none";
  });
 };
 search?.addEventListener("input",filter);filter();
 list?.addEventListener("click",e=>{
  const option=e.target.closest("[data-class]");if(!option)return;
  hidden.value=option.dataset.class;
  search.value=option.dataset.class==="none"?"":option.dataset.class;
  const chosenClass=option.dataset.class;groupField.style.display=["6М","8А","8В","8Г","8Д","8Е","9А"].includes(chosenClass)?"block":"none";const subgroupSelect=$("#subGroup"),subgroupLabel=$("#subgroup-label");if(subgroupSelect&&["6М","8А","8В","8Г","8Д","8Е","9А"].includes(chosenClass)){const labels=["1-я подгруппа","2-я подгруппа"];subgroupSelect.innerHTML=labels.map((label,i)=>`<option value="${i+1}">${label}</option>`).join("");subgroupSelect.value=data.profile.subGroup||"1";if(subgroupLabel)subgroupLabel.textContent="Моя подгруппа";}
  list.querySelectorAll("[data-class]").forEach(el=>{
   const active=el===option;el.setAttribute("aria-selected",String(active));
   el.style.background=active?"var(--soft,#eef1f8)":"transparent";
  });
  filter();
 });
}
function remove(list,idValue,label){
 if(!confirm(`Удалить ${label}?`))return;
 data[list]=data[list].filter(x=>x.id!==idValue);save();render();
}

function action(a,el){
 const n=Number(el.dataset.id);
 if(a==="calendar-prev"||a==="calendar-next"){
  const step=a==="calendar-next"?1:-1;
  if(calendarYearView)calendarMonth=new Date(calendarMonth.getFullYear()+step,calendarMonth.getMonth(),1);
  else if(calendarExpanded)calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+step,1);
  else{const d=dateObj(selectedCalendarDate);d.setDate(d.getDate()+step*7);selectedCalendarDate=localDate(d);calendarMonth=new Date(d.getFullYear(),d.getMonth(),1)}
  return render();
 }
 if(a==="calendar-view-toggle"){if(calendarYearView){calendarYearView=false;calendarExpanded=true}else if(calendarExpanded){calendarExpanded=false;calendarYearView=true}else{calendarExpanded=true}return render()}
 if(a==="calendar-back-week"){calendarYearView=false;calendarExpanded=false;calendarMonth=new Date(dateObj(selectedCalendarDate).getFullYear(),dateObj(selectedCalendarDate).getMonth(),1);return render()}
 if(a==="calendar-open-month"){const m=Number(el.dataset.month),y=Number(el.dataset.year);calendarMonth=new Date(y,m,1);selectedCalendarDate=localDate(new Date(y,m,1));calendarYearView=false;calendarExpanded=true;return render()}
 if(a==="calendar-expand"){calendarExpanded=!calendarExpanded;return render()}
 if(a==="calendar-today"){calendarMonth=new Date();selectedCalendarDate=today;calendarYearView=false;calendarExpanded=false;return render()}
 if(a==="calendar-select"){selectedCalendarDate=el.dataset.date;if(calendarExpanded){calendarExpanded=false;calendarYearView=false;const picked=dateObj(selectedCalendarDate);calendarMonth=new Date(picked.getFullYear(),picked.getMonth(),1)}return render()}
 if(a==="calendar-add-task")return taskForm(null,selectedCalendarDate);
 if(a==="calendar-add-deadline")return deadlineForm(null,selectedCalendarDate);
 if(a==="add-task")return taskForm();
 if(a==="edit-task")return taskForm(n);
 if(a==="delete-task")return remove("tasks",n,"задание");
 if(a==="toggle-task"){const t=data.tasks.find(x=>x.id===n);if(t)t.done=!t.done;save();return render()}
 if(a==="add-deadline")return deadlineForm();
 if(a==="edit-deadline")return deadlineForm(n);
 if(a==="delete-deadline")return remove("deadlines",n,"дедлайн");
 if(a==="add-lesson")return lessonForm();
 if(a==="edit-lesson"){
  const classLesson=(data.classSchedules?.[data.profile.schoolClass]||[]).find(x=>String(x.id)===String(el.dataset.id));
  if(classLesson)return schoolLessonRoomForm(el.dataset.id);
  return lessonForm(el.dataset.id);
 }
 if(a==="delete-lesson"){
  const isClassLesson=(data.classSchedules?.[data.profile.schoolClass]||[]).some(x=>String(x.id)===String(el.dataset.id));
  if(isClassLesson)return;
  data.schedule=data.schedule.filter(x=>String(x.id)!==String(el.dataset.id));save();render();return;
 }
 if(a==="add-grade")return gradeForm();
 if(a==="add-grade-subject")return gradeForm(null,el.dataset.subject);
 if(a==="edit-grade")return gradeForm(n);
 if(a==="delete-grade")return remove("grades",n,"оценку");
 if(a==="add-goal")return goalForm();
 if(a==="edit-goal")return goalForm(el.dataset.subject);
 if(a==="choose-avatar"){document.getElementById("avatar-file")?.click();return;}
 if(a==="remove-avatar"){data.profile.avatar="";save();return renderProfile();}
 if(a==="edit-profile")return profileForm();
 if(a==="edit-class")return classForm();
 if(a==="set-class"){const chosen=el.dataset.class;data.profile.schoolClass=chosen;save();renderProfile();return;}
 if(a==="select-day"){data.selectedDay=Number(el.dataset.day);save();return render()}
 if(a==="go-deadlines")return setPage("deadlines");
 if(a==="hide-welcome"||a==="show-welcome"){
  welcomeHidden=a==="hide-welcome";
  try{
   if(welcomeHidden)localStorage.setItem(WELCOME_HIDDEN_KEY,"1");
   else localStorage.removeItem(WELCOME_HIDDEN_KEY);
  }catch(e){}
  return render();
 }
 if(a==="close-modal")return closeModal();
 if(a==="reset-data"){if(confirm("Сбросить приложение?\n\nИмя, фотография, выбранный класс, личное расписание, задания, оценки, цели и дедлайны будут удалены. Календарь, каникулы, выходные и праздники останутся без изменений.")){data=clone(initial);welcomeHidden=false;try{localStorage.removeItem(WELCOME_HIDDEN_KEY)}catch(e){}save();render()}}
}

document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-page]");
 if(nav){setPage(nav.dataset.page);return}
 const el=e.target.closest("[data-action]");
 if(el)action(el.dataset.action,el);
});
document.addEventListener("change",e=>{
 if(e.target.id==="profile-avatar-file"&&e.target.files?.[0]){
  const file=e.target.files[0];
  if(!["image/jpeg","image/png","image/webp","image/avif"].includes(file.type)){alert("Можно загружать только фотографии в форматах JPG, PNG, WEBP или AVIF.");e.target.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=512,scale=Math.min(1,max/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    const avatarData=canvas.toDataURL("image/jpeg",.82);
    const hidden=document.getElementById("profile-avatar-data");
    const preview=document.getElementById("profile-avatar-preview");
    if(hidden)hidden.value=avatarData;
    if(preview){preview.classList.add("has-photo");preview.innerHTML=`<img src="${avatarData}" alt="Аватарка">`;}
   };
   img.onerror=()=>alert("Не удалось открыть это изображение.");
   img.src=reader.result;
  };
  reader.onerror=()=>alert("Не удалось прочитать файл.");
  reader.readAsDataURL(file);
 }
 if(e.target.dataset.action==="toggle-reminders"){
  data.profile.reminders=e.target.checked;save();render();
 }
});
save();
render();
})();
</script>

document.addEventListener("gestureend",function(e){e.preventDefault()},{passive:false});
document.addEventListener("dblclick",function(e){e.preventDefault()},{passive:false});
